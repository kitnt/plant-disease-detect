<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>植物叶片病害分类</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #result-box { margin-top: 20px; font-size: 24px; color: #2c3e50; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>植物叶片病害分类平台</h1>
    <p>点击下方按钮，使用分类模型识别叶片病害</p>
    <button onclick="startCamera()">打开摄像头</button>
    <br><br>
    <video id="video" width="480" height="360" autoplay style="border: 2px solid #ccc;"></video>
    <canvas id="canvas" width="480" height="360" style="display: none;"></canvas>
    
    <div id="result-box">等待识别...</div>

    <script>
        const socket = io();
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultBox = document.getElementById('result-box');

        socket.on('connect', () => {
            console.log('已连接');
        });

        socket.on('detection_result', function(data) {
            resultBox.innerText = `识别结果：${data.class_name}（置信度 ${data.confidence}）`;
        });

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    setInterval(captureAndSend, 300); // 每 300 毫秒发一帧（约 3 FPS，不卡）
                })
                .catch(err => {
                    alert('无法打开摄像头：' + err.message);
                });
        }

        function captureAndSend() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataURL = canvas.toDataURL('image/jpeg', 0.8);
            socket.emit('video_frame', dataURL);
        }
    </script>
</body>
</html>
