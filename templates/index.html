<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>植物叶片病害分类</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 40px; }
        #preview { max-width: 500px; margin: 20px auto; display: block; border: 1px solid #ccc; }
        #result-box { margin-top: 20px; font-size: 24px; color: #2c3e50; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>植物叶片病害分类平台</h1>
    <p>请上传一张植物叶片图片进行识别</p>

    <input type="file" id="fileInput" accept="image/*" onchange="previewAndSend()">
    <br><br>
    <img id="preview" src="" alt="图片预览" style="display: none;">

    <div id="result-box">等待识别...</div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log('已连接');
        });

        // 接收后端识别结果
        socket.on('detection_result', function(data) {
            document.getElementById('result-box').innerText = 
                `识别结果：${data.class_name}（置信度 ${data.confidence}）`;
        });

        // 上传图片并发送
        function previewAndSend() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            // 1. 本地预览
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview');
                preview.src = e.target.result;
                preview.style.display = 'block';

                // 2. 通过 SocketIO 发送 base64 给后端
                socket.emit('video_frame', e.target.result);
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
